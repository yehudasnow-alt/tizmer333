# גיבוי למשימה היומית (תזכורות מנוי, בקשות חוות דעת, סיכום יומי למנהל, ניקוי יומנים).
# בדרך כלל Vercel Cron מריץ אותה ב-05:00 UTC; הריצה הזו באה אחריה ומשלימה רק מה שלא יצא,
# כי כל מייל נרשם ביומן ויוצא פעם אחת בלבד. משתמשת באותם Secrets כמו סנכרון היומנים (SITE_URL, CRON_SECRET).
name: Daily tasks (backup run)
on:
  schedule:
    - cron: "35 6 * * *"
  workflow_dispatch:
jobs:
  daily:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Run /api/daily
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then echo "SITE_URL / CRON_SECRET not set – skipping"; exit 0; fi
          BASE="$(printf '%s' "$SITE_URL" | tr -d '[:space:]')"; BASE="${BASE%/}"
          SECRET="$(printf '%s' "$CRON_SECRET" | tr -d '[:space:]')"
          code=$(curl -sS -o resp.txt -w '%{http_code}' --connect-timeout 15 --max-time 90 --retry 2 --retry-delay 10 --retry-all-errors -X POST -H "Authorization: Bearer $SECRET" "$BASE/api/daily") || { echo "::error::The site did not answer (curl exit $?). Check SITE_URL."; exit 1; }
          echo "HTTP $code"
          # המאגר ציבורי: מדפיסים רק מספרים, בלי כתובות מייל ושמות
          jq -c '{ok, today, planned, sent, skipped, more, note, errors: ((.errors // []) | length), maintenance, error}' resp.txt 2>/dev/null || echo "(no JSON)"
          if [ "$code" = "401" ] || [ "$code" = "403" ]; then echo "::error::CRON_SECRET here is different from CRON_SECRET in Vercel, or shorter than 16 characters"; exit 1; fi
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then echo "::error::The site answered HTTP $code"; exit 1; fi
