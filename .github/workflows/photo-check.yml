name: photo-check (temporary)
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: |
          cat > /tmp/c.mjs <<'JS'
          import vm from "node:vm"; import fs from "node:fs";
          import { placePhotos } from "./scripts/place-photos.mjs";
          const app = { window: { TAMARA_CONFIG: {} }, console, Intl, Date, Math, JSON }; app.window.window = app.window; vm.createContext(app);
          for (const f of ["core.js", "seed.js"]) vm.runInContext(fs.readFileSync("assets/js/" + f, "utf8"), app);
          const places = app.window.Tamara.CURATED_PLACES;
          fs.mkdirSync("/tmp/out", { recursive: true });
          const r = await placePhotos(places, "/tmp/out");
          console.log("FOUND", Object.keys(r).length, "of", places.length);
          for (const p of places) console.log(p.id, r[p.id] ? (r[p.id].src.startsWith("assets") ? "saved" : "remote") + " | " + r[p.id].credit + " | " + r[p.id].link.split("/").pop() : "NONE");
          JS
          cp /tmp/c.mjs ./c.mjs && node c.mjs
