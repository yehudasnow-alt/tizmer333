# סנכרון יומני iCal כל שעה (Vercel בחינם מריץ Cron רק פעם ביום, אז GitHub משלים)
# צריך להגדיר ב-GitHub → Settings → Secrets and variables → Actions:
#   SITE_URL     למשל https://www.tamara.co.il
#   CRON_SECRET  אותו ערך כמו ב-Vercel
name: iCal sync (hourly)
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Sync calendars
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then echo "SITE_URL / CRON_SECRET not set – skipping"; exit 0; fi
          BASE="$(printf '%s' "$SITE_URL" | tr -d '[:space:]')"; BASE="${BASE%/}"
          SECRET="$(printf '%s' "$CRON_SECRET" | tr -d '[:space:]')"
          code=$(curl -sS -o resp.txt -w '%{http_code}' --connect-timeout 15 --max-time 90 --retry 2 --retry-delay 10 --retry-all-errors -X POST -H "Authorization: Bearer $SECRET" "$BASE/api/sync-ical") || { echo "::error::The site did not answer (curl exit $?). Check SITE_URL."; exit 1; }
          echo "HTTP $code"; cat resp.txt; echo
          if [ "$code" = "401" ] || [ "$code" = "403" ]; then echo "::error::CRON_SECRET here is different from CRON_SECRET in Vercel"; exit 1; fi
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then echo "::error::The site answered HTTP $code"; exit 1; fi
